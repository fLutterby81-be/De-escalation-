<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Een prikkelarme applicatie voor acute de-escalatie." />
    <meta name="theme-color" content="#f7f2ec" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <title>De-escalation</title>
    <script>
      // Apply the theme before first paint to avoid a light flash at night.
      // Same rules as src/theme.ts: a saved manual choice wins, otherwise
      // dark when the device is in dark mode or between 21:00 and 07:00.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('de-escalation:theme');
        } catch (e) {}
        var hour = new Date().getHours();
        var night = hour >= 21 || hour < 7;
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = saved === 'dark' || (saved !== 'light' && (night || prefersDark));
        if (dark) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1f1a17');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
